<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DispatchFlow — Orders</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #23313f;
      font-family: Arial, sans-serif;
    }

    header {
      background: #18232e;
      color: white;
      padding: 22px 30px;
    }

    header strong { font-size: 24px; }
    header span { color: #aebdcb; margin-left: 15px; }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    h1 { margin-bottom: 8px; }
    .subtitle { color: #6d7c89; }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 25px 0;
    }

    button {
      padding: 11px 16px;
      border: 1px solid #dce2e8;
      border-radius: 7px;
      background: white;
      cursor: pointer;
      font: inherit;
    }

    button.active {
      background: #ef6b40;
      border-color: #ef6b40;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .card {
      background: white;
      border: 1px solid #e3e8ed;
      border-radius: 12px;
      padding: 22px;
    }

    .table-wrapper { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    th, td {
      text-align: left;
      padding: 15px 12px;
      border-bottom: 1px solid #edf0f3;
    }

    th {
      background: #f8fafb;
      font-size: 12px;
      color: #6d7c89;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 5px;
      background: #eef2f6;
      text-transform: capitalize;
    }

    .status.pending { background: #fff2df; color: #956315; }
    .status.confirmed { background: #e8f1ff; color: #3667ac; }

    #message { color: #6d7c89; }
    #message.error { color: #b53c3c; }

    dialog {
      width: min(600px, 92vw);
      max-height: 85vh;
      overflow-y: auto;
      border: none;
      border-radius: 12px;
      padding: 25px;
    }

    dialog::backdrop { background: #18232e88; }

    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dialog-header h2 { margin: 0; }

    dl {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 15px;
      margin-top: 25px;
    }

    dt { color: #6d7c89; }
    dd { margin: 0; overflow-wrap: anywhere; }

    @media (max-width: 600px) {
      header span { display: block; margin: 8px 0 0; }
      dl { grid-template-columns: 1fr; gap: 8px; }
      dd { margin-bottom: 12px; }
      .card { padding: 12px; }
    }
  </style>
</head>

<body>
  <header>
    <strong>DispatchFlow</strong>
    <span>Fleet & Delivery DSS · Manager Portal</span>
  </header>

  <main>
    <h1>Orders</h1>
    <p class="subtitle">Review delivery orders and customer details.</p>

    <div class="toolbar">
      <button id="pending-button" class="active">Pending Orders</button>
      <button id="all-button">All Orders</button>
      <button id="refresh-button">Refresh</button>
      <button id="new-order-button">+ New Order</button>
    </div>

    <section class="card">
      <p id="message" role="status"></p>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Order Code</th>
              <th>Customer</th>
              <th>Total Amount</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="orders"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="details-dialog" aria-labelledby="details-title">
    <div class="dialog-header">
      <h2 id="details-title">Order Details</h2>
      <button id="close-dialog" aria-label="Close order details">Close</button>
    </div>
    <div id="details-content"></div>
  </dialog>

  <script>
    const tbody = document.getElementById("orders");
    const message = document.getElementById("message");
    const pendingButton = document.getElementById("pending-button");
    const allButton = document.getElementById("all-button");
    const refreshButton = document.getElementById("refresh-button");
    const dialog = document.getElementById("details-dialog");
    const detailsContent = document.getElementById("details-content");

    const currency = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "VND",
      maximumFractionDigits: 0
    });

    let currentView = "pending";
    let loading = false;

    function setLoading(value) {
      loading = value;
      pendingButton.disabled = value;
      allButton.disabled = value;
      refreshButton.disabled = value;
    }

    async function loadOrders() {
      if (loading) return;

      setLoading(true);
      message.className = "";
      message.textContent = "Loading orders...";
      tbody.replaceChildren();

      try {
        const url = currentView === "pending"
          ? "/api/orders/pending"
          : "/api/orders";

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Unable to load orders. Please try again.");
        }

        const result = await response.json();

        for (const order of result.data) {
          const row = document.createElement("tr");

          const values = [
            order.order_code,
            order.customer_name,
            currency.format(Number(order.total_amount))
          ];

          for (const value of values) {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          }

          const statusCell = document.createElement("td");
          const statusBadge = document.createElement("span");
          statusBadge.className = "status";

          if (["pending", "confirmed"].includes(order.status)) {
            statusBadge.classList.add(order.status);
          }

          statusBadge.textContent = order.status;
          statusCell.appendChild(statusBadge);
          row.appendChild(statusCell);

          const actionCell = document.createElement("td");
          const detailsButton = document.createElement("button");
          detailsButton.textContent = "View Details";

          detailsButton.addEventListener("click", async () => {
            detailsButton.disabled = true;
            try {
              await showDetails(order.id);
            } finally {
              detailsButton.disabled = false;
            }
          });

          actionCell.appendChild(detailsButton);
          row.appendChild(actionCell);
          tbody.appendChild(row);
        }

        message.textContent = result.data.length
          ? `${result.data.length} orders found.`
          : "No orders found.";
      } catch (error) {
        message.className = "error";
        message.textContent = error.message;
      } finally {
        setLoading(false);
      }
    }

    async function showDetails(id) {
      detailsContent.textContent = "Loading order details...";

      if (!dialog.open) {
        dialog.showModal();
      }

      try {
        const response = await fetch(`/api/orders/${id}`);
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Unable to load order details.");
        }

        const order = result.data;
        const fields = [
          ["Order Code", order.order_code],
          ["Customer", order.customer_name],
          ["Phone", order.customer_phone],
          ["Address", order.delivery_address],
          ["Total Amount", currency.format(Number(order.total_amount))],
          ["Status", order.status],
          ["Created At", new Date(order.created_at).toLocaleString("en-GB")]
        ];

        const list = document.createElement("dl");

        for (const [label, value] of fields) {
          const term = document.createElement("dt");
          const description = document.createElement("dd");

          term.textContent = label;
          description.textContent = value;
          list.append(term, description);
        }

        detailsContent.replaceChildren(list);
      } catch (error) {
        detailsContent.textContent = error.message;
      }
    }

    function switchView(view) {
      if (loading) return;

      currentView = view;
      pendingButton.classList.toggle("active", view === "pending");
      allButton.classList.toggle("active", view === "all");
      loadOrders();
    }

    pendingButton.addEventListener("click", () => switchView("pending"));
    allButton.addEventListener("click", () => switchView("all"));
    refreshButton.addEventListener("click", loadOrders);
    document.getElementById("close-dialog")
      .addEventListener("click", () => dialog.close());

    loadOrders();
  </script>
  <style>
  #new-order-button {
    background: #ef6b40;
    border-color: #ef6b40;
    color: white;
  }

  .order-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 25px;
  }

  .order-form-grid label {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
  }

  .order-form-grid input,
  .order-form-grid textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #dce2e8;
    border-radius: 7px;
    font: inherit;
  }

  .order-form-grid textarea {
    min-height: 85px;
    resize: vertical;
  }

  .full-width {
    grid-column: 1 / -1;
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  #create-order-button {
    background: #ef6b40;
    border-color: #ef6b40;
    color: white;
  }

  #new-order-error {
    color: #b53c3c;
    margin: 0;
  }

  @media (max-width: 600px) {
    .order-form-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<dialog id="new-order-dialog" aria-labelledby="new-order-title">
  <div class="dialog-header">
    <h2 id="new-order-title">Create New Order</h2>
    <button
      id="close-new-order"
      type="button"
      aria-label="Close new order form"
    >
      Close
    </button>
  </div>

  <form id="new-order-form" class="order-form-grid">
    <label>
      Order Code
      <input
        name="order_code"
        placeholder="SF005"
        maxlength="30"
        pattern="[A-Za-z0-9_-]+"
        title="Use letters, numbers, hyphens or underscores."
        required
      >
    </label>

    <label>
      Customer Name
      <input
        name="customer_name"
        placeholder="Demo Customer E"
        maxlength="100"
        required
      >
    </label>

    <label>
      Customer Phone
      <input
        name="customer_phone"
        type="tel"
        placeholder="0900000005"
        maxlength="16"
        pattern="\+?[0-9]{8,15}"
        title="Enter 8–15 digits, optionally starting with +."
        required
      >
    </label>

    <label>
      Total Amount (VND)
      <input
        name="total_amount"
        type="number"
        placeholder="110000"
        min="0"
        max="1000000000"
        step="1"
        required
      >
    </label>

    <label class="full-width">
      Delivery Address
      <textarea
        name="delivery_address"
        placeholder="Demo delivery address E"
        maxlength="255"
        required
      ></textarea>
    </label>

    <p id="new-order-error" class="full-width" role="alert"></p>

    <div class="form-actions full-width">
      <button id="cancel-new-order" type="button">Cancel</button>
      <button id="create-order-button" type="submit">
        Create Order
      </button>
    </div>
  </form>
</dialog>

<script>
  const newOrderDialog = document.getElementById("new-order-dialog");
  const newOrderForm = document.getElementById("new-order-form");
  const newOrderError = document.getElementById("new-order-error");
  const createOrderButton = document.getElementById("create-order-button");

  let creatingOrder = false;

  document.getElementById("new-order-button")
    .addEventListener("click", () => {
      newOrderForm.reset();
      newOrderError.textContent = "";
      newOrderDialog.showModal();
    });

  function closeNewOrder() {
    if (!creatingOrder) {
      newOrderDialog.close();
    }
  }

  document.getElementById("close-new-order")
    .addEventListener("click", closeNewOrder);

  document.getElementById("cancel-new-order")
    .addEventListener("click", closeNewOrder);

  newOrderDialog.addEventListener("cancel", (event) => {
    if (creatingOrder) {
      event.preventDefault();
    }
  });

  newOrderForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (creatingOrder) return;

    creatingOrder = true;
    createOrderButton.disabled = true;
    createOrderButton.textContent = "Creating...";
    newOrderError.textContent = "";

    const body = Object.fromEntries(new FormData(newOrderForm));
    body.total_amount = Number(body.total_amount);

    try {
      const response = await fetch("/api/orders", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.message || "Unable to create the order.");
      }

      newOrderDialog.close();
      newOrderForm.reset();

      await loadOrders();
    } catch (error) {
      newOrderError.textContent = error.message;
    } finally {
      creatingOrder = false;
      createOrderButton.disabled = false;
      createOrderButton.textContent = "Create Order";
    }
  });
</script>
</body>
</html>
